name: Playwright Tests

# Runs on main only: PRs are merged straight away, so a PR run would just
# duplicate the run on the merge commit.
on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run Jest unit tests
        run: npm test -- --ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests (Chromium)
        run: npx playwright test --browser=chromium --reporter=list
        env:
          CI: true
      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
      - name: Upload test-results artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
